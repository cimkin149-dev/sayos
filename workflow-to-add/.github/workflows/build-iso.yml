name: Build SayMy OS ISO

# Builds the ISO on GitHub's servers, so you do not need a Linux machine.
# Run it from the Actions tab ("Run workflow"), or it runs on every push to main.
# Push a tag like v0.1.0 to also publish the ISO as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    name: Quick checks (about 1 minute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run project checks
        run: bash tests/run-all.sh

  build-iso:
    name: Build the ISO (45 to 90 minutes)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build inside a Debian 13 container
        run: |
          set -o pipefail
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD":/src -v "$PWD/out":/out \
            debian:trixie bash /src/scripts/docker-entry.sh 2>&1 | tee out/console.log

      - name: Last 60 lines of the log
        if: always()
        run: tail -n 60 out/console.log || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saymy-os-build-logs
          path: out/*.log
          if-no-files-found: ignore

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: saymy-os-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
